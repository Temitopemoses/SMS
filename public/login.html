<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | SchoolDesk</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f4f7fb}.login{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #e7edf5;border-radius:16px;padding:34px;box-shadow:0 18px 50px #17304c0c}.login h1{font-size:23px;margin:25px 0 7px}.login p{font-size:13px;color:#718096;line-height:1.6}.login label{display:block;font-size:12px;margin:22px 0 7px}.login input{width:100%;padding:12px;border:1px solid #dfe5ed;border-radius:8px}.login button{width:100%;margin-top:15px}.note{font-size:11px!important;margin-top:15px}</style></head><body><main class="login"><div class="brand" style="padding:0"><div class="brandmark">S</div><div><strong>SchoolDesk</strong><small>School management, simplified</small></div></div><h1>Welcome back</h1><p>Sign in to access your school's workspace. A secure one-time code will be sent to your email.</p><form id="form"><label>Email address</label><input id="email" type="email" autocomplete="username webauthn" required><div id="codewrap" hidden><label>Six-digit verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div><button class="btn" id="submit">Continue with email</button></form><p class="note" id="message">Secure passwordless sign-in.</p></main><script>const A=window.hatchable.auth;let step=0;const form=document.getElementById('form'),msg=document.getElementById('message'),btn=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;try{const email=document.getElementById('email').value.trim();if(!step){await A.startLogin({email});step=1;document.getElementById('codewrap').hidden=false;btn.textContent='Verify and sign in';msg.textContent='Check your inbox for the six-digit sign-in code.';document.getElementById('code').focus()}else{await A.verifyCode({email,code:document.getElementById('code').value.trim()});location.href='/'} }catch(err){msg.textContent=err.message||'Unable to sign in. Please try again.'}finally{btn.disabled=false}});</script></body></html>
